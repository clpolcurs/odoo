[project]
name = "lj-grammar"
version = "0.1.0"
description = "Write and check grammar_patterns of the learning_japanese grammar points (NihonGo grammar matching)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "sudachipy>=0.7,<0.8",
    "sudachidict-core>=20250101",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Japanese and Vietnamese text is intended
