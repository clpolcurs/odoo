[project]
name = "lj-audio-cues"
version = "0.1.0"
description = "Propose and write the audio cues of listening items: which block their audio reads when."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "faster-whisper>=1.1",
    "sudachipy>=0.7,<0.8",
    "sudachidict-core>=20250101",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Japanese and Vietnamese text is intended
